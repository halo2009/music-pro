<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="스케일 훈련">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>스케일 암기 훈련</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Scale Memory Trainer</p>
        <h1>스케일 암기 훈련</h1>
      </div>
      <div class="score-card" aria-label="정답 현황">
        <span>정답률</span>
        <strong id="accuracy">0%</strong>
      </div>
    </header>

    <nav class="main-tabs" aria-label="화면 선택">
      <button class="active" type="button" data-view="quiz">문제 맞추기</button>
      <button type="button" data-view="harmony">화성학</button>
      <button type="button" data-view="review">오답노트</button>
      <button type="button" data-view="chart">스케일 차트</button>
      <button type="button" data-view="circle">5도권</button>
    </nav>

    <section id="quizView" class="view">
      <section class="toolbar" aria-label="문제 설정">
        <label>
          <span>문제 방식</span>
          <select id="quizMode">
            <option value="full">전체 쓰기</option>
            <option value="partial">부분 맞추기</option>
          </select>
        </label>
        <label>
          <span>스케일 종류</span>
          <select id="quizScale"></select>
        </label>
        <label>
          <span>키 범위</span>
          <select id="quizKeySet">
            <option value="circle">5도권 순서</option>
            <option value="common">자주 쓰는 키</option>
            <option value="all">전체 키</option>
          </select>
        </label>
        <label>
          <span>난이도</span>
          <select id="quizDifficulty">
            <option value="easy">쉬움</option>
            <option value="normal" selected>보통</option>
            <option value="hard">어려움</option>
          </select>
        </label>
      </section>
      <section class="quick-options" aria-label="편의 설정">
        <label class="toggle-option">
          <input id="autoNextToggle" type="checkbox" checked>
          <span>정답이면 3초 뒤 자동 넘기기</span>
        </label>
        <button id="resetScoreButton" class="mini-button" type="button">점수 초기화</button>
      </section>

      <section class="quiz-card" aria-live="polite">
        <div class="quiz-meta">
          <span id="quizTypeLabel">전체 쓰기</span>
          <span id="quizProgress">0 / 0</span>
        </div>
        <h2 id="quizPrompt">문제를 불러오는 중</h2>
        <p id="quizHint" class="hint"></p>
        <div id="answerSlots" class="answer-slots"></div>
        <input id="answerInput" class="answer-input" type="text" autocomplete="off" spellcheck="false" placeholder="예: C D E F G A B C">
        <div id="notePad" class="note-pad" aria-label="음 입력 버튼">
          <button type="button" data-note="C">C</button>
          <button type="button" data-note="D">D</button>
          <button type="button" data-note="E">E</button>
          <button type="button" data-note="F">F</button>
          <button type="button" data-note="G">G</button>
          <button type="button" data-note="A">A</button>
          <button type="button" data-note="B">B</button>
          <button class="accidental" type="button" data-accidental="#">#</button>
          <button class="accidental" type="button" data-accidental="b">b</button>
          <button class="pad-action" type="button" data-pad-action="backspace" aria-label="마지막 음 지우기" title="마지막 음 지우기">⌫</button>
          <button class="pad-action clear" type="button" data-pad-action="clear">전체 지우기</button>
        </div>
        <div id="feedback" class="feedback hidden"></div>
      </section>

      <section class="actions">
        <button id="checkButton" class="primary" type="button">확인</button>
        <button id="hintButton" class="secondary" type="button">힌트</button>
        <button id="nextButton" class="secondary" type="button">다음 문제</button>
        <button id="shuffleButton" class="secondary" type="button">문제 섞기</button>
      </section>
    </section>

    <section id="harmonyView" class="view hidden">
      <section class="toolbar compact" aria-label="화성학 문제 설정">
        <label>
          <span>난이도</span>
          <select id="harmonyDifficulty">
            <option value="all">전체</option>
            <option value="easy">쉬움</option>
            <option value="normal">보통</option>
            <option value="hard">어려움</option>
          </select>
        </label>
      </section>
      <section class="quick-options" aria-label="화성학 편의 설정">
        <span class="option-note">화성학도 정답을 맞추면 자동으로 넘어갑니다.</span>
      </section>

      <section class="quiz-card" aria-live="polite">
        <div class="quiz-meta">
          <span id="harmonyTopic">화성학</span>
          <span id="harmonyProgress">0 / 0</span>
        </div>
        <h2 id="harmonyPrompt">문제를 불러오는 중</h2>
        <p id="harmonyHint" class="hint"></p>
        <div id="harmonyAnswers" class="choice-grid" aria-label="화성학 답 선택"></div>
        <div id="harmonyFeedback" class="feedback hidden"></div>
      </section>

      <section class="actions">
        <button id="harmonyNextButton" class="primary" type="button">다음 문제</button>
        <button id="harmonyShuffleButton" class="secondary" type="button">문제 섞기</button>
      </section>
    </section>

    <section id="reviewView" class="view hidden">
      <section class="circle-panel">
        <div class="review-head">
          <div>
            <p class="eyebrow">Wrong Answer Review</p>
            <h2>오답노트</h2>
            <p id="reviewSummary" class="hint">틀린 스케일이 여기에 쌓입니다.</p>
          </div>
          <button id="startReviewButton" class="primary small-command" type="button">오답만 풀기</button>
          <button id="clearReviewButton" class="secondary small-command" type="button">오답 비우기</button>
        </div>
        <div id="reviewList" class="review-list"></div>
      </section>
    </section>

    <section id="chartView" class="view hidden">
      <section class="chart-filter">
        <label>
          <span>보고 싶은 스케일</span>
          <select id="chartScale"></select>
        </label>
      </section>

      <section id="scaleInfo" class="scale-info"></section>
      <section id="scaleChart" class="scale-chart" aria-label="스케일 차트"></section>
    </section>

    <section id="circleView" class="view hidden">
      <section class="circle-panel">
        <div>
          <p class="eyebrow">Circle of Fifths</p>
          <h2>5도권 암기표</h2>
          <p class="hint">오른쪽으로 갈수록 샵이 하나씩 늘고, 왼쪽으로 갈수록 플랫이 하나씩 늘어납니다.</p>
        </div>
        <div id="circleList" class="circle-list"></div>
      </section>
    </section>
  </main>

  <script src="app.js?v=9"></script>
</body>
</html>
